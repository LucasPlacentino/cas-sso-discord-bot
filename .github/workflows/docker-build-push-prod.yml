name: Build and push prod docker image

on:
  push:
    branches:
      - 'main'

jobs:
  docker:
    name: docker prod build and push
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Extract VERSION
        id: get_version
        run: |
          FULL=$(cat VERSION)
          MAJOR=$(echo "$FULL" | cut -d. -f1)
          MINOR=$(echo "$FULL" | cut -d. -f1,2)

          echo "version=$FULL" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT

          echo "🔢 Version: $FULL"
          echo "🔢 Minor: $MINOR"
          echo "🔢 Major: $MAJOR"

      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/amd64,linux/arm64
      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      #- name: 🔐 Log in to GitHub Container Registry (GHCR)
      #  uses: docker/login-action@v3
      #  with:
      #    registry: ghcr.io
      #    username: ${{ github.actor }}
      #    password: ${{ secrets.GHCR_TOKEN }}
      #- name: 🔐 Login to DockerHub
      #  uses: docker/login-action@v3
      #  with:
      #    username: ${{ secrets.DOCKERHUB_USERNAME }}
      #    password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: 🛠 Build docker image for GHRC
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          load: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.minor }}
            ghcr.io/${{ github.repository }}:${{ steps.get_version.outputs.major }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.version }}

      - name: 🛠 Build docker image for Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          load: true
          tags: bepolytech/ulbdiscordbot:test-build # only test build
          tags: |
            docker.io/${{ github.repository }}:latest
            docker.io/${{ github.repository }}:${{ steps.get_version.outputs.version }}
            docker.io/${{ github.repository }}:${{ steps.get_version.outputs.minor }}
            docker.io/${{ github.repository }}:${{ steps.get_version.outputs.major }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.version=${{ steps.get_version.outputs.version }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.version }}

      - name: 🔍 Check Docker images are built
        run: |
          echo "🔍 Checking if the Docker images are built..."
          # Check if the images exist locally
          docker images
      
      #-
      #  name: Test docker image
      #  run: |
      #    docker run --rm bepolytech/ulbdiscordbot:test

      - name: ✅ Done
        run: echo "✅ Prod Docker image built and pushed successfully."
