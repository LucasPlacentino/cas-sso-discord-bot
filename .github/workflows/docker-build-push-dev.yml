name: Build and push DEV docker image

on:
  push:
    branches:
      - 'dev'

jobs:
  docker:
    name: docker DEV build and push
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4

      - name: 📦 Extract VERSION
        id: get_version
        run: |
          FULL=$(cat VERSION)
          MAJOR=$(echo "$FULL" | cut -d. -f1)
          MINOR=$(echo "$FULL" | cut -d. -f1,2)

          echo "version=$FULL" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT

          echo "🔢 Version: $FULL"
          echo "🔢 Minor: $MINOR"
          echo "🔢 Major: $MAJOR"

      - name: ⚙️ Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/amd64,linux/arm64
      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }} # or ${{ github.actor }} ?
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🔐 Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: 🛠 Build docker DEV image for GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:dev-latest
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:dev-${{ steps.get_version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:dev-${{ steps.get_version.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/${{ github.repository }}:dev-${{ steps.get_version.outputs.major }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.version="dev-${{ steps.get_version.outputs.version }}"
          build-args: |
            VERSION="dev-${{ steps.get_version.outputs.version }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛠 Build docker DEV image for Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          load: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.repository }}:dev-latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.repository }}:dev-${{ steps.get_version.outputs.version }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.repository }}:dev-${{ steps.get_version.outputs.minor }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ github.repository }}:dev-${{ steps.get_version.outputs.major }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.version="dev-${{ steps.get_version.outputs.version }}"
          build-args: |
            VERSION="dev-${{ steps.get_version.outputs.version }}"
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Check Docker images are built
        run: |
          echo "🔍 Checking if the Docker images are built..."
          # Check if the images exist locally
          docker images
      
      #-
      #  name: Test docker image
      #  run: |
      #    docker run --rm ${{ github.repository_owner }}/${{ vars.containername }}:dev-latest

      - name: ✅ Done
        run: echo "✅ DEV Docker image built and pushed successfully."
